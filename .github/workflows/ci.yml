name: CI

# Pull requests only: pushing to main is done from a verified local run, and a
# green CI badge on main is not worth the extra minutes it burns.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # The library is the published artifact; the demo consumes its source, so
      # building it here is what proves the packaged form compiles too.
      - run: pnpm build
