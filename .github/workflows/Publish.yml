#
# Stages `oop-react` on npm through OpenID Connect — npm's "trusted publisher" flow,
# with staged publishing as the approval step. Pushing a `v*.*.*` tag is what starts
# a release: there is no npm token in this repository, no `npm publish` on a laptop,
# and no OTP prompt here. A maintainer still has to approve the staged version with
# 2FA before it goes live; the surrounding steps are in AGENTS.md ("发版流程（npm）").
#
# Three things outside this file have to line up; all three are case-sensitive:
#
#   1. On npmjs.com -> oop-react -> Settings -> Trusted publishing, a GitHub Actions
#      publisher for shijianjs/oop-react whose workflow filename is exactly
#      `Publish.yml`. Leave "Allowed actions" at its default: a trusted publisher may
#      always run `npm stage publish`, and *not* ticking the direct `npm publish` box
#      is the stronger setting — a compromised workflow can then only propose a
#      version, never ship one. Nothing here needs that box, because the step below
#      stages instead of publishing.
#   2. The runner must be GitHub-hosted (OIDC is not issued to self-hosted runners).
#   3. The job needs `id-token: write`, below — without it npm falls back to token
#      auth and fails with ENEEDAUTH.
#
# Provenance attestations come for free: an OIDC publish from a public repository
# generates one automatically, so `--provenance` is deliberately absent.
name: Publish

on:
  push:
    # The tag has to equal the version in packages/oop-react/package.json, which the
    # job checks before staging — a tag decides *that* a release happens, the
    # manifest decides *what* is staged.
    tags: ['v*.*.*']

permissions:
  contents: read
  # Exchange the workflow's OIDC token for a short-lived publish credential.
  id-token: write

# Two runs for the same version cannot both succeed, but they can race; the later
# one is the one that should wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Needs >= 22.14.0; npm ships the CLI that speaks OIDC, checked below.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never cache a release build: the artifact that gets staged should not
          # depend on whether the cache happened to survive.
          package-manager-cache: false

      # `npm stage` itself only exists from 11.15.0 on, and anything older than 11.5.1
      # does not do the OIDC handshake at all. Such a CLI would fall back to token auth
      # and fail with ENEEDAUTH, which reads like a broken trusted publisher
      # configuration rather than an outdated CLI — so fail early, and say why.
      - name: Check the npm CLI can stage-publish through a trusted publisher
        run: |
          set -euo pipefail
          need=11.15.0
          have=$(npm --version)
          echo "node $(node --version), npm ${have} (need >= ${need})"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::npm ${have} cannot stage-publish through a trusted publisher (needs >= ${need})"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # The library is the published artifact; the demo consumes its source, so
      # building it here is what proves the packaged form compiles too.
      - run: pnpm build

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/oop-react/package.json').version")
          expected="v${version}"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::tag ${TAG} does not match ${expected} — bump packages/oop-react/package.json first"
            exit 1
          fi
          echo "staging oop-react@${version}"

      - name: Stage the publish
        # `prepack` builds dist/ again, the same way the library's own scripts do;
        # the registry is the default public one, so no --registry and no token. npm
        # prints "staged with id <stage-id>" here — approving that id is what ships it.
        working-directory: packages/oop-react
        run: npm stage publish

      # The run is green before the version is live, so the run page has to say so.
      - name: What happens next
        run: |
          {
            echo "### Staged on npm — approval still required"
            echo
            echo "\`npm stage publish\` does not put the version on the registry; it waits in the"
            echo "staging area until a maintainer approves it with 2FA:"
            echo
            echo '```bash'
            echo "npm stage list                 # list staged versions you can approve"
            echo "npm stage approve <stage-id>   # approve and publish (needs 2FA)"
            echo '```'
            echo
            echo "Or use the **Staged Packages** tab on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
